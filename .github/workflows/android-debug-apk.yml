name: Android Debug APK

# 목적: apps/mobile(React Native, bare CLI) 안드로이드 앱을 debug 서명(레포에 커밋된
# apps/mobile/android/app/debug.keystore)으로 빌드해서, 별도 시크릿 설정 없이
# GitHub Releases의 고정 태그(android-debug-latest)에 항상 최신 APK를 게시한다.
# release APK(assembleRelease)는 실제 서명 키가 없어 이 워크플로 범위에 포함하지 않는다.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

# 같은 릴리즈 태그를 여러 실행이 동시에 갱신하지 않도록 직렬화한다.
concurrency:
  group: android-debug-apk
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 생성/갱신에 필요

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ubuntu-latest 호스티드 러너에는 Android SDK가 기본 포함되어 있지만,
      # 이 프로젝트가 요구하는 compileSdk 35 / build-tools 35.0.0 컴포넌트가
      # 러너 이미지 버전에 따라 빠져있을 수 있어 setup-android로 SDK 상태를
      # 명시적으로 보장한다(멱등적 — 이미 있으면 그대로 사용).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JS dependencies (npm ci)
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for release asset
        run: |
          mkdir -p /tmp/release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/release-assets/feel-music-share-debug.apk

      - name: Record build metadata
        id: meta
        run: |
          echo "date_utc=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: /tmp/release-assets/feel-music-share-debug.apk
          retention-days: 30

      - name: Publish/update rolling GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: android-debug-latest
          name: "Android Debug Build (자동, 최신)"
          body: |
            feel_music_share 안드로이드 **debug APK** 자동 빌드입니다. `main` 브랜치에
            `apps/mobile/**` 변경이 push될 때마다 이 릴리즈(고정 태그 `android-debug-latest`)의
            내용과 첨부 파일이 새 빌드로 교체됩니다.

            - 커밋: `${{ steps.meta.outputs.short_sha }}` (${{ github.sha }})
            - 빌드 일시: ${{ steps.meta.outputs.date_utc }}
            - 워크플로 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **주의 (초기 개발 단계 빌드)**: 이 APK는 debug 서명이며, Firebase 프로젝트와
            Spotify Developer 앱이 아직 실제로 연결되지 않았습니다. Spotify 로그인, 세션
            생성/참여, 실시간 동기화 등 핵심 기능은 아직 동작하지 않고 화면 UI 확인용입니다.
          artifacts: /tmp/release-assets/feel-music-share-debug.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          makeLatest: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

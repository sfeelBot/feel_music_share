buildscript {
    ext {
        // react-native-app-auth(Spotify OAuth Custom Tabs, services/auth/spotifyAuth.ts)의
        // android/build.gradle이 `androidx.browser:browser:1.9.0`을 하드코딩 의존한다
        // (net.openid:appauth의 CustomTabsIntent.Builder#setEphemeralBrowsingEnabled() 사용 —
        // 이 API는 androidx.browser 1.9.0에서 새로 추가된 것이라 더 낮은 버전으로
        // resolutionStrategy.force 하면 컴파일 자체가 깨진다). androidx.browser 1.9.0은
        // AAR 메타데이터로 compileSdk 36 이상을, AGP 8.9.1 이상을 요구하므로 둘 다 맞춰 올린다.
        // AGP는 compileSdk 36을 지원하는 최소 안정 버전대(8.10.x)의 최신 패치(8.10.1)를 사용해
        // RN 0.76.9가 기본으로 검증한 8.6.0에서 필요 이상으로 멀리 가지 않도록 한다.
        buildToolsVersion = "36.1.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase(google-services.json) 파싱 + google-services 매핑 리소스 생성 플러그인.
        // 4.5.0 = 이 시점(2026-07-27) Google Maven(dl.google.com) maven-metadata.xml 기준 최신
        // 안정 버전. AGP 최소 요구치가 낮아(3.4+) 우리 AGP 8.10.1/Gradle 8.11.1과 호환된다.
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
